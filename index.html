<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>
    <title>Images Slide Show</title>
  </head>
  <body>
    <div class="container">
      <div class="mySlides">
        <div class="numbertext">1 / 6</div>
        <img src="./media/longexp.JPG" style="width: 100%" />
      </div>

      <div class="mySlides">
        <div class="numbertext">2 / 6</div>
        <img src="./media/radblu.jpg" ="width: 100%" />
      </div>

      <div class="mySlides">
        <div class="numbertext">3 / 6</div>
        <img src="./media/Liberty.jpg" ="width: 100%" />
      </div>

      <div class="mySlides">
        <div class="numbertext">4 / 6</div>
        <img src="./media/nottscastle.jpg" ="width: 100%" />
      </div>

      <div class="mySlides">
        <div class="numbertext">5 / 6</div>
        <img src="./media/funfair.jpg" ="width: 100%" />
      </div>

      <div class="mySlides">
        <div class="numbertext">6 / 6</div>
        <img src="./media/mediacity.jpg" ="width: 100%" />
      </div>

      <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
      <a class="next" onclick="plusSlides(1)">&#10095;</a>

      <div class="caption-container">
        <p id="caption"></p>
      </div>

      <div class="row">
        <div class="column">
          <img
            class="demo cursor"
            src="./media/longexp.JPG"
            style="width: 100%"
            onclick="currentSlide(1)"
            alt="Long Exposure"
          />
        </div>
        <div class="column">
          <img
            class="demo cursor"
            src="./media/radblu.jpg"
            style="width: 100%"
            onclick="currentSlide(2)"
            alt="Raddison Blu"
          />
        </div>
        <div class="column">
          <img
            class="demo cursor"
            src="./media/Liberty.jpg"
            style="width: 100%"
            onclick="currentSlide(3)"
            alt="Liberty"
          />
        </div>
        <div class="column">
          <img
            class="demo cursor"
            src="./media/nottscastle.jpg"
            style="width: 100%"
            onclick="currentSlide(4)"
            alt="Nottingham Castle"
          />
        </div>
        <div class="column">
          <img
            class="demo cursor"
            src="./media/funfair.jpg"
            style="width: 100%"
            onclick="currentSlide(5)"
            alt="Fun Fair"
          />
        </div>
        <div class="column">
          <img
            class="demo cursor"
            src="./media/mediacity.jpg"
            style="width: 100%"
            onclick="currentSlide(6)"
            alt="Media City"
          />
        </div>
      </div>
    </div>
  </body>
</html>
